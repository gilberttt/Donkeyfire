# Fly.io config. Change `app` to a name nobody else has taken (it becomes <app>.fly.dev), then see README "Deploy to Fly.io".
app = "donkeyfire"
primary_region = "iad"

[build]

# One machine only: the SQLite database and uploads live on a single volume.
[[mounts]]
  source = "donkeyfire_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
